  <rect x="12" y="14" width="40" height="36" rx="6" fill="#FAF8F2" stroke="#E8E3D8" stroke-width="2"/>
  
  <!-- Film Sprocket notches -->
  <rect x="16" y="18" width="6" height="5" rx="1.5" fill="#202822"/>
  <rect x="42" y="18" width="6" height="5" rx="1.5" fill="#202822"/>
  <rect x="16" y="41" width="6" height="5" rx="1.5" fill="#202822"/>
  <rect x="42" y="41" width="6" height="5" rx="1.5" fill="#202822"/>

  <!-- Timeframe Trim Region (Lime) -->
